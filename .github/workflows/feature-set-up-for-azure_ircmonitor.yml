name: Build and deploy - IrcMonitor

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after a successful build
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: "Production"

    steps:
      - uses: actions/checkout@v2

      # Setup .NET
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Install LocalDB
      - name: Install LocalDB
        uses: potatoqualitee/mssqlsuite@v1.8
        with:
          install: localdb

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Build test projects
        run: |
          dotnet build tests/Application.IntegrationTests/Application.IntegrationTests.csproj  --configuration Release
          dotnet build tests/Application.UnitTests/Application.UnitTests.csproj  --configuration Release

      - name: Test with the dotnet CLI
        run: |
          dotnet test tests/Application.IntegrationTests/Application.IntegrationTests.csproj
          dotnet test tests/Application.UnitTests/Application.UnitTests.csproj

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install deps
      - name: Install dependencies for React UI
        working-directory: src/IrcMonitor.ReactUi
        run: npm ci

      # Build React UI
      - name: Build React UI
        working-directory: src/IrcMonitor.ReactUi
        env:
          VITE_GOOGLE_APP_ID: ${{ secrets.GOOGLEAPPID }}
        run: npm run build

      # Copy React build output to .NET's wwwroot
      - name: Copy React build to .NET wwwroot
        run: |
          cp -r src/IrcMonitor.ReactUi/dist/* src/IrcMonitor.WebUI/wwwroot/

      - name: dotnet publish
        run: dotnet publish src/IrcMonitor.WebUI/IrcMonitor.WebUI.csproj  -c Release -o "${{env.DOTNET_ROOT}}/irc-monitor"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/irc-monitor

      - name: Zip published application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path packages -Force | Out-Null
          [System.IO.Compression.ZipFile]::CreateFromDirectory("$env:DOTNET_ROOT/irc-monitor", "$PWD/packages/ircmonitor.zip")

      - name: Log in to Azure using federation
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload application to Azure Blob Storage
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: |
          $sourceBranch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $tierArguments = @()
          $destinationPath = if ($sourceBranch -eq 'main') {
            "ircmonitor/main/$env:GITHUB_RUN_ID"
          } else {
            $tierArguments = @('--tier', 'Hot')
            "ircmonitor/branches/$sourceBranch/$env:GITHUB_RUN_ID"
          }
          az storage blob upload-batch `
            --account-name "$env:AZURE_STORAGE_ACCOUNT" `
            --destination artifacts `
            --destination-path "$destinationPath" `
            --source packages `
            --pattern "ircmonitor.zip" `
            --auth-mode login `
            --overwrite true `
            --only-show-errors @tierArguments

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    runs-on: windows-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: "IrcMonitor"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C18A791C34E945EB9FB49AFB6EE88B78 }}
          package: app
