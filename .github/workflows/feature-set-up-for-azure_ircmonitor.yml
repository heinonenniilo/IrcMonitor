name: Build and test - IrcMonitor

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: "Production"

    steps:
      - uses: actions/checkout@v2

      # Setup .NET
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Install LocalDB
      - name: Install LocalDB
        uses: potatoqualitee/mssqlsuite@v1.8
        with:
          install: localdb

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Build test projects
        run: |
          dotnet build tests/Application.IntegrationTests/Application.IntegrationTests.csproj  --configuration Release
          dotnet build tests/Application.UnitTests/Application.UnitTests.csproj  --configuration Release

      - name: Run unit tests
        run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj

      - name: Run integration tests
        run: dotnet test tests/Application.IntegrationTests/Application.IntegrationTests.csproj

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install deps
      - name: Install dependencies for React UI
        working-directory: src/IrcMonitor.ReactUi
        run: npm ci

      # Build React UI
      - name: Build React UI
        working-directory: src/IrcMonitor.ReactUi
        env:
          VITE_GOOGLE_APP_ID: ${{ secrets.GOOGLEAPPID }}
        run: npm run build

      # Copy React build output to .NET's wwwroot
      - name: Copy React build to .NET wwwroot
        run: |
          cp -r src/IrcMonitor.ReactUi/dist/* src/IrcMonitor.WebUI/wwwroot/

      - name: Publish web Windows x86
        run: >-
          dotnet publish src/IrcMonitor.WebUI/IrcMonitor.WebUI.csproj
          --configuration Release
          --runtime win-x86
          --output artifacts/web/win-x86

      - name: Publish web Windows x64
        run: >-
          dotnet publish src/IrcMonitor.WebUI/IrcMonitor.WebUI.csproj
          --configuration Release
          --runtime win-x64
          --output artifacts/web/win-x64

      - name: Publish web Linux x64
        run: >-
          dotnet publish src/IrcMonitor.WebUI/IrcMonitor.WebUI.csproj
          --configuration Release
          --runtime linux-x64
          --output artifacts/web/linux-x64

      - name: Publish function Windows x86
        run: >-
          dotnet publish src/IrcMonitor.RowInserterFunction/IrcMonitor.RowInserterFunction.csproj
          --configuration Release
          --runtime win-x86
          --output artifacts/function/win-x86

      - name: Publish function Windows x64
        run: >-
          dotnet publish src/IrcMonitor.RowInserterFunction/IrcMonitor.RowInserterFunction.csproj
          --configuration Release
          --runtime win-x64
          --output artifacts/function/win-x64

      - name: Publish function Linux x64
        run: >-
          dotnet publish src/IrcMonitor.RowInserterFunction/IrcMonitor.RowInserterFunction.csproj
          --configuration Release
          --runtime linux-x64
          --output artifacts/function/linux-x64

      - name: Zip Linux x64 applications for Blob Storage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path packages -Force | Out-Null
          foreach ($component in @('web', 'function')) {
            [System.IO.Compression.ZipFile]::CreateFromDirectory("$PWD/artifacts/$component/linux-x64", "$PWD/packages/irc-monitor-$component-linux-x64.zip")
          }

      - name: Log in to Azure using federation
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload application to Azure Blob Storage
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: |
          $sourceBranch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $tierArguments = @()
          $destinationPath = if ($sourceBranch -eq 'main') {
            "ircmonitor/main/$env:GITHUB_RUN_ID"
          } else {
            $tierArguments = @('--tier', 'Hot')
            "ircmonitor/branches/$sourceBranch/$env:GITHUB_RUN_ID"
          }
          az storage blob upload-batch `
            --account-name "$env:AZURE_STORAGE_ACCOUNT" `
            --destination artifacts `
            --destination-path "$destinationPath" `
            --source packages `
            --pattern "irc-monitor-*-linux-x64.zip" `
            --auth-mode login `
            --overwrite true `
            --only-show-errors @tierArguments
